name: EuroLeague model

on:
  schedule:
    # Picks every 2 hours on EuroLeague game days (Tue-Fri), 09:07-21:07 Athens winter time.
    # GitHub's timer can run hours late, so several runs make sure one lands before tip-off.
    # Picks are only logged for games that haven't started, and each line is logged once.
    # Off-minute (:07) avoids GitHub's busiest top-of-hour slots.
    - cron: "7 7,9,11,13,15,17,19 * * 2-5"
    - cron: "41 22 * * *"   # 00:41 Athens: grade last night's picks
    - cron: "23 5 * * *"    # 07:23 Athens: second grading pass in case the first ran early or failed
  workflow_dispatch:
    inputs:
      mode:
        description: "picks or grade"
        default: picks
        type: choice
        options: [picks, grade]

permissions:
  contents: write

concurrency:
  group: model
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Restore databases (latest cache)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            engine/euroleague.db
            engine/basketball.db
            engine/dbs
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: First run - unpack the starting databases
        if: steps.cache.outputs.cache-matched-key == ''
        run: tar -xJf data/seed/data_seed.tar.xz -C engine

      - name: Point /home/claude at the engine (scripts use that path)
        run: sudo ln -sfn "$GITHUB_WORKSPACE/engine" /home/claude

      - name: Decide mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "41 22 * * *"|"23 5 * * *") MODE=grade ;;
              *) MODE=picks ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run the model
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        working-directory: engine/runner
        run: python daily_run.py ${{ steps.mode.outputs.mode }}

      - name: Save databases
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            engine/euroleague.db
            engine/basketball.db
            engine/dbs
          key: data-${{ github.run_id }}

      - name: Commit results (triggers the Vercel rebuild)
        run: |
          git config user.name "model-bot"
          git config user.email "model-bot@users.noreply.github.com"
          git add web/data engine/runner/*.csv engine/leagues/lkl_index.json || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Model run: ${{ steps.mode.outputs.mode }} $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
